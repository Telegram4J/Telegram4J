# Settings for SecretChatConsole.
#
# Copy this to secret-chat-console.properties, which is not committed, and fill it in. Each
# setting can also come from the environment, which wins over both:
#
#     environment  ->  secret-chat-console.properties  ->  this file
#
# This file is read from the classpath and does not care where the program runs. The copy is read
# from the working directory, which Gradle sets to core/ while an IDE usually uses the project
# root. The same goes for a relative session.file, so a session started under one will not be
# found by the other unless its path is absolute.

# Credentials from https://my.telegram.org, env T4J_API_ID and T4J_API_HASH.
#
# Use your own. Telegram notices an official client's api_id arriving from something that is not
# that client, and acting on it is one of the documented reasons accounts get limited. Nothing is
# filled in here on purpose: this file is committed, and credentials do not belong in it.
api.id=
api.hash=

# The account to act as, in international format. Env T4J_PHONE.
phone=+00000000000

# Where the authorization key, the secret chats and their keys are kept between runs.
# Env T4J_SESSION_FILE. Defaults to secret-chat-console-<digits of phone>.bin.
#
# This file is the chats: it holds their keys in the clear, and there is no server-side copy to
# recover them from. Do not commit it and do not share it.
#session.file=

# A SOCKS5 proxy as host:port, or blank to connect directly. Env T4J_SOCKS5_PROXY.
# A system-wide VPN which works by setting the machine's proxy settings does not cover raw
# sockets, so point this at the port the client listens on locally. Hiddify defaults to 12334,
# and the port a proxy client is using is visible in its own settings.
#
#proxy.socks5=127.0.0.1:12334
proxy.socks5=
#proxy.username=
#proxy.password=

# Whether to read peers which open a chat in MTProto 1.0, MadelineProto among them.
# Env T4J_ACCEPT_LEGACY_MTPROTO. Off by default: accepting it lets a peer downgrade the chat to a
# construction whose message key does not involve the key at all.
accept.legacy.mtproto=false

# Messages older than this many seconds are ignored. Env T4J_IGNORE_OLDER_THAN_SECONDS.
# On the first connection the server replays everything missed while the account was offline.
ignore.older.than.seconds=3600

# How many sent messages each chat keeps so that it can send them again on request.
# Env T4J_OUTBOX_CAPACITY, zero to keep none.
#
# A peer that loses one of our messages shows nothing we send after it, and asks for the missing
# one; only a side that still has it can answer.
outbox.capacity=32

# Whether those messages outlive the process. Env T4J_OUTBOX_PERSIST.
# The hole worth answering is usually the one that opened while this was not running, so turning
# this off gives up most of what the outbox is for.
outbox.persist=true

# Where a persisted outbox writes them, one messages<chatId>.json for each chat.
# Env T4J_OUTBOX_DIRECTORY. Defaults to encrypted-messages/<digits of phone>, next to the session
# file and, like it, relative to the working directory.
#
# The files hold the messages exactly as they were sent, so they are of no use without the keys in
# the session file, and of every use with them. They are covered by .gitignore.
#outbox.directory=
